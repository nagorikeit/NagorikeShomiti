name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: Build Pure Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Step 1: Checkout Repository Code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js Environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Step 3: Setup Java JDK 21
      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Step 4: Setup Gradle Environment
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
          validate-wrappers: false

      # Step 5: Install Dependencies
      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      # Step 6: Build Web Frontend
      - name: Build Web App
        run: npm run build

      # Step 7: Capacitor Sync Android
      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      # Step 8: Build Pure Android Debug APK
      - name: Build Android Debug APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.14.3
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # Step 9: Prepare APK Output
      - name: Collect Generated APK
        run: |
          mkdir -p apk-output
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} apk-output/amar-somiti.apk \;
          echo "=== APK File Generated Successfully ==="
          ls -lh apk-output/

      # Step 10: Upload APK Artifact for Download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: amar-somiti-android-apk
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 30
